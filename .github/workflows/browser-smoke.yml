name: Browser Smoke
on:
  pull_request:
    # Validate small PRs stacked on the v0.1.0 migration branch before merging.
    branches: [master, 'chore/3-import-v0-snapshot']
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'src-tauri/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node 24)
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --only-shell chromium
      - name: Start application
        run: |
          npm run dev > /tmp/mdress-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/mdress-server.log; exit 1
      - run: node scripts/e2e.mjs
      - name: Component UX Audit
        run: node scripts/component-ux-audit.mjs
      # Temporary, read-only evidence transport. Not the permanent PR image publisher.
      # No repository write permission; PNGs are already compressed.
      - name: Upload short-lived UX review bundle
        id: evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ux-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/ux-audit/*.png
            test-results/component-ux-audit.json
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
      - name: Evidence status
        if: always()
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          echo '## Evidências visuais' >> "$GITHUB_STEP_SUMMARY"
          echo 'Revisão visual ainda pendente; checks verdes não aprovam UX.' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EVIDENCE_URL" ]; then
            echo "[Baixar pacote temporário de screenshots e relatório JSON]($EVIDENCE_URL) (expira em 2 dias; requer acesso ao GitHub)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Nenhum pacote disponível nesta execução.' >> "$GITHUB_STEP_SUMMARY"
          fi
          find test-results/ux-audit -name '*.png' 2>/dev/null | wc -l >> "$GITHUB_STEP_SUMMARY"
